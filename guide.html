<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Golf Guide</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    :root{--bg:#f5f5f7;--surface:#ffffff;--surface2:#eeeff2;--surface3:#e4e5ea;--green:#1a5c2e;--green-b:#2d7a40;--gold:#8a6010;--gold-l:#6b4a0c;--cream:#0f172a;--muted:#6b7280;--border:rgba(0,0,0,0.06);--c-shadow:0 1px 4px rgba(0,0,0,0.07),0 0 0 1px rgba(0,0,0,0.04);--c-border:none;--nav-h:64px;--safe-b:env(safe-area-inset-bottom,0px);}
    body.dark{--bg:#0a1a0e;--surface:#111f15;--surface2:#1a2f1e;--surface3:#223828;--gold:#c9a84c;--gold-l:#e8cc7a;--cream:#f0ead8;--muted:#6a8a6e;--border:rgba(255,255,255,0.08);--c-shadow:none;--c-border:1px solid var(--border);}
    /* ── THEMES ── */
    body.theme-white{--bg:#f5f5f7;--surface:#ffffff;--surface2:#eeeff2;--surface3:#e4e5ea;--green:#1a5c2e;--green-b:#2d7a40;--gold:#8a6010;--gold-l:#6b4a0c;--cream:#0f172a;--muted:#6b7280;--border:rgba(0,0,0,0.06);--c-shadow:0 1px 4px rgba(0,0,0,0.07),0 0 0 1px rgba(0,0,0,0.04);--c-border:none;}
    body.theme-warm{--bg:#f5f0e8;--surface:#ffffff;--surface2:#ede8de;--surface3:#e0d9cc;--green:#2d6a3f;--green-b:#3d8a52;--gold:#8a6010;--gold-l:#6b4a0c;--cream:#1c2018;--muted:#6a7a68;--border:rgba(0,0,0,0.07);--c-shadow:0 1px 4px rgba(0,0,0,0.06),0 0 0 1px rgba(0,0,0,0.04);--c-border:none;}
    body.theme-forest{--bg:#0a1a0e;--surface:#111f15;--surface2:#1a2f1e;--surface3:#223828;--green:#2d6a3f;--green-b:#3d8a52;--gold:#c9a84c;--gold-l:#e8cc7a;--cream:#f0ead8;--muted:#6a8a6e;--border:rgba(255,255,255,0.08);--c-shadow:none;--c-border:1px solid var(--border);}
    body.theme-classic{--bg:#f5f0e8;--surface:#ffffff;--surface2:#ede8de;--surface3:#e0d9cc;--green:#2d6a3f;--green-b:#3d8a52;--gold:#8a6010;--gold-l:#6b4a0c;--cream:#1c2018;--muted:#6a7a68;--border:rgba(0,0,0,0.07);--c-shadow:0 1px 4px rgba(0,0,0,0.06),0 0 0 1px rgba(0,0,0,0.04);--c-border:none;}
    body.theme-ocean{--bg:#071520;--surface:#0d2035;--surface2:#122840;--surface3:#183350;--green:#1a6a8a;--green-b:#2a8aaa;--gold:#4db8d4;--gold-l:#7dd4e8;--cream:#e8f4f8;--muted:#5a8aa0;--border:rgba(255,255,255,0.08);--c-shadow:none;--c-border:1px solid var(--border);}
    body.theme-rose{--bg:#1e0f17;--surface:#2d1525;--surface2:#3d1e33;--surface3:#4d2840;--green:#3d1e33;--green-b:#4d2840;--gold:#f0a0b8;--gold-l:#d4809a;--cream:#fdf0f4;--muted:#a07088;--border:rgba(240,160,184,0.15);--c-shadow:none;--c-border:1px solid var(--border);}
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--cream);font-family:'Outfit',sans-serif;transition:background .2s,color .2s;}
    /* ── SHELL ── */
    #app{display:flex;flex-direction:column;height:100dvh;}
    #topbar{flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--border);padding:10px 16px;padding-top:calc(16px + env(safe-area-inset-top,0px));display:flex;align-items:center;justify-content:space-between;gap:8px;}
    .tb-logo{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;letter-spacing:2px;color:var(--gold);cursor:pointer;flex-shrink:0;}
    .tb-logo span{color:var(--cream);}
    .tb-sub{font-size:0.6rem;color:var(--muted);letter-spacing:1px;text-transform:uppercase;}
    #pills{display:flex;gap:5px;flex-wrap:wrap;flex:1;justify-content:center;}
    .pill{background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:4px 11px;color:var(--muted);font-family:'Outfit',sans-serif;font-size:0.68rem;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap;}
    .pill.on{background:rgba(138,96,16,0.15);border-color:var(--gold);color:var(--gold);}
    body.dark .pill.on{background:rgba(201,168,76,0.15);}
    .tb-btn{background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:5px 9px;font-size:0.9rem;cursor:pointer;color:var(--cream);flex-shrink:0;}
    #pages{flex:1;overflow:hidden;position:relative;}
    .page{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;opacity:0;pointer-events:none;transform:translateY(10px);transition:opacity .22s,transform .22s;padding-bottom:calc(var(--nav-h) + var(--safe-b) + 16px);}
    .page.on{opacity:1;pointer-events:all;transform:translateY(0);}
    #nav{flex-shrink:0;background:var(--surface);border-top:1px solid var(--border);display:flex;height:calc(var(--nav-h) + var(--safe-b));padding-bottom:var(--safe-b);}
    .nb{flex:1;height:var(--nav-h);align-self:flex-start;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:none;background:none;color:var(--muted);font-family:'Outfit',sans-serif;font-size:0.54rem;font-weight:500;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;transition:color .15s;}
    .nb svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
    .nb.on{color:var(--gold);}
    .nb.on svg{stroke:var(--gold);}
    /* ── LANDING ── */
    #landing{position:fixed;inset:0;z-index:999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:28px 20px;padding-top:calc(44px + env(safe-area-inset-top,0px));overflow-y:auto;}
    #landing.hidden{opacity:0;pointer-events:none;transition:opacity .3s;}
    .ld-logo{font-family:'Bebas Neue',sans-serif;font-size:2.2rem;letter-spacing:4px;color:var(--gold);text-align:center;}
    .ld-logo span{color:var(--cream);}
    .ld-sub{font-size:0.68rem;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin:4px 0 28px;text-align:center;}
    .ld-q{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;letter-spacing:2px;color:var(--cream);margin-bottom:12px;text-align:center;}
    .ld-cards{display:flex;flex-direction:column;gap:10px;width:100%;max-width:400px;}
    .ld-card{border-radius:18px;padding:16px 18px;cursor:pointer;display:flex;align-items:center;gap:16px;border:2px solid var(--border);background:var(--surface);box-shadow:0 4px 20px rgba(0,0,0,0.08);transition:border-color .18s,transform .15s;user-select:none;}
    body.dark .ld-card{box-shadow:0 4px 20px rgba(0,0,0,0.4);}
    .ld-card:active{transform:scale(0.97);}
    .ld-card:hover{border-color:var(--gold);}
    .ld-av{font-size:2.4rem;flex-shrink:0;}
    .ld-name{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;letter-spacing:2px;color:var(--gold);line-height:1;}
    .ld-desc{font-size:0.65rem;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-top:2px;}
    .ld-arr{font-size:1.3rem;color:var(--muted);}
    /* ── COMPONENTS ── */
    .ph{background:var(--surface);padding:22px 20px 18px;border-bottom:1px solid var(--border);position:relative;overflow:hidden;}
    .ph-tag{font-size:0.62rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-bottom:3px;}
    .ph-title{font-family:'Bebas Neue',sans-serif;font-size:2.2rem;letter-spacing:1px;color:var(--cream);line-height:1;}
    .ph-sub{font-size:0.75rem;color:var(--muted);margin-top:5px;}
    .sect{padding:16px 20px;}
    .sect-title{font-family:'Outfit',sans-serif;font-size:0.68rem;font-weight:700;letter-spacing:1.5px;color:var(--muted);margin-bottom:12px;text-transform:uppercase;}
    .card{background:var(--surface);border:var(--c-border);border-radius:16px;padding:16px;margin-bottom:10px;box-shadow:var(--c-shadow);}
    .ct{font-weight:700;font-size:0.92rem;color:var(--cream);margin-bottom:6px;}
    .cb{font-size:0.85rem;color:var(--muted);line-height:1.65;}
    .cb strong{color:var(--cream);}
    .cue{background:rgba(138,96,16,0.07);border-left:3px solid var(--gold);border-radius:0 10px 10px 0;padding:10px 14px;font-size:0.8rem;color:var(--gold-l);margin-top:10px;line-height:1.5;}
    body.dark .cue{background:rgba(201,168,76,0.08);color:var(--gold-l);}
    .pills-row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px;}
    .ptag{background:var(--surface2);border:none;border-radius:20px;padding:4px 10px;font-size:0.7rem;color:var(--muted);font-weight:500;}
    .tag{display:inline-block;font-size:0.62rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:2px 9px;border-radius:20px;margin-bottom:6px;}
    .tg-pur{background:rgba(139,92,246,.12);color:#a78bfa;}
    .tg-gld{background:rgba(138,96,16,.1);color:var(--gold);}
    body.dark .tg-gld{color:var(--gold-l);background:rgba(201,168,76,.12);}
    .tg-org{background:rgba(251,146,60,.12);color:#f97316;}
    .tg-blu{background:rgba(59,130,246,.12);color:#3b82f6;}
    .tg-grn{background:rgba(26,92,46,.1);color:var(--green);}
    /* ── LOCATION SWITCHER ── */
    .loc-switcher{display:flex;gap:6px;padding:14px 20px 6px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
    .loc-switcher::-webkit-scrollbar{display:none;}
    .loc-btn{flex-shrink:0;border:1px solid var(--border);border-radius:20px;padding:7px 16px;font-family:'Outfit',sans-serif;font-size:0.82rem;font-weight:600;background:var(--surface);color:var(--muted);cursor:pointer;transition:all .18s;}
    .loc-btn.active{background:var(--green);border-color:var(--green);color:#fff;}
    .loc-btn:active{transform:scale(0.96);}
    .loc-panel{display:none;}.loc-panel.on{display:block;}
    /* ── END LOCATION SWITCHER ── */
    .stat-row{display:flex;gap:10px;padding:16px 20px;flex-wrap:wrap;}
    .stat{flex:1;min-width:60px;background:var(--surface);border-radius:14px;padding:14px 8px;text-align:center;box-shadow:var(--c-shadow);border:var(--c-border);}
    .sn{font-family:'Bebas Neue',sans-serif;font-size:2rem;color:var(--green);line-height:1;}
    .sl{font-size:0.58rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:3px;font-weight:600;}
    .hero{background:var(--surface);padding:24px 20px 20px;border-bottom:1px solid var(--border);}
    .hg{font-size:0.68rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:6px;}
    .ht{font-family:'Bebas Neue',sans-serif;font-size:2.8rem;letter-spacing:1px;color:var(--cream);line-height:1;margin-bottom:14px;}
    .ht span{color:var(--gold);}
    .hgoal{background:rgba(26,92,46,0.07);border:1px solid rgba(26,92,46,0.15);border-radius:14px;padding:14px 15px;display:flex;align-items:center;gap:13px;}
    body.dark .hgoal{background:rgba(45,106,63,0.15);border-color:rgba(201,168,76,0.3);}
    .hgn{font-family:'Bebas Neue',sans-serif;font-size:2.2rem;color:var(--green);line-height:1;flex-shrink:0;}
    .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:16px 20px;}
    .gc{background:var(--surface);border:var(--c-border);border-radius:16px;padding:16px;cursor:pointer;transition:transform .15s,box-shadow .15s;text-decoration:none;display:block;box-shadow:var(--c-shadow);}
    .gc:active{transform:scale(0.97);}
    .gc:hover{box-shadow:0 4px 16px rgba(0,0,0,0.1);}
    .gi{font-size:1.5rem;display:block;margin-bottom:8px;}
    .gt{font-weight:700;font-size:0.85rem;color:var(--cream);margin-bottom:2px;}
    .gs{font-size:0.72rem;color:var(--muted);}
    .nb-box{background:rgba(26,92,46,0.06);border:1px solid rgba(26,92,46,0.15);border-radius:12px;padding:12px 14px;font-size:0.82rem;color:var(--cream);line-height:1.6;margin-bottom:10px;}
    body.dark .nb-box{background:rgba(45,106,63,0.12);border-color:rgba(45,106,63,0.3);}
    .nb-box strong{color:var(--green);}
    .cr{display:flex;align-items:flex-start;gap:9px;padding:10px 0;border-bottom:1px solid var(--border);font-size:0.85rem;color:var(--cream);line-height:1.55;}
    .cr:last-child{border-bottom:none;}
    /* progress */
    .prog-entry{background:var(--surface);border:var(--c-border);border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;box-shadow:var(--c-shadow);}
    .pe-date{font-size:0.75rem;color:var(--muted);flex-shrink:0;}
    .pe-note{font-size:0.82rem;color:var(--cream);flex:1;padding:0 10px;}
    .pe-del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:1rem;padding:3px;}
    textarea#pnote{width:100%;background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:12px;color:var(--cream);font-family:'Outfit',sans-serif;font-size:0.85rem;resize:vertical;min-height:76px;outline:none;transition:border-color .18s;}
    textarea#pnote:focus{border-color:var(--gold);}
    .log-btn{background:var(--green);border:none;border-radius:12px;padding:12px 18px;color:#fff;font-family:'Outfit',sans-serif;font-size:0.88rem;font-weight:700;cursor:pointer;margin-top:8px;width:100%;}
    .log-round-btn{background:none;border:1.5px solid var(--gold);border-radius:12px;padding:12px 18px;color:var(--gold);font-family:'Outfit',sans-serif;font-size:0.88rem;font-weight:700;cursor:pointer;margin-top:8px;width:100%;}
    /* ── ROUND MODAL ── */
    .round-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:800;opacity:0;pointer-events:none;transition:opacity .25s;}
    .round-overlay.open{opacity:1;pointer-events:all;}
    .round-sheet{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-radius:22px 22px 0 0;padding:20px 18px;z-index:801;transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);max-height:90vh;overflow-y:auto;padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));}
    .round-sheet.open{transform:translateY(0);}
    .round-sheet-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px;}
    .round-sheet-title{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;letter-spacing:1.5px;color:var(--gold);margin-bottom:14px;}
    .round-input{width:100%;background:var(--surface2);border:1.5px solid var(--border);border-radius:10px;padding:10px 13px;color:var(--cream);font-family:'Outfit',sans-serif;font-size:0.9rem;outline:none;transition:border-color .15s;margin-bottom:10px;}
    .round-input:focus{border-color:var(--gold);}
    .hole-toggle{display:flex;gap:8px;margin-bottom:14px;}
    .hole-toggle button{flex:1;padding:9px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface2);color:var(--muted);font-family:'Outfit',sans-serif;font-weight:700;font-size:0.85rem;cursor:pointer;transition:all .15s;}
    .hole-toggle button.active{border-color:var(--gold);color:var(--gold);background:rgba(138,96,16,0.08);}
    .hole-grid{display:grid;grid-template-columns:repeat(9,1fr);gap:5px;margin-bottom:14px;}
    .hole-cell{display:flex;flex-direction:column;align-items:center;gap:3px;}
    .hole-num{font-size:0.58rem;color:var(--muted);font-weight:600;text-align:center;}
    .hole-score-input{width:100%;background:var(--surface2);border:1.5px solid var(--border);border-radius:7px;padding:6px 2px;color:var(--cream);font-family:'Outfit',sans-serif;font-size:0.85rem;font-weight:700;text-align:center;outline:none;transition:border-color .15s;}
    .hole-score-input:focus{border-color:var(--gold);}
    .round-total-row{display:flex;justify-content:space-between;align-items:center;background:rgba(138,96,16,0.07);border:1px solid rgba(138,96,16,0.2);border-radius:10px;padding:10px 14px;margin-bottom:14px;}
    .round-total-label{font-size:0.78rem;color:var(--muted);font-weight:600;letter-spacing:.5px;text-transform:uppercase;}
    .round-total-val{font-family:'Bebas Neue',sans-serif;font-size:1.8rem;color:var(--gold);}
    .round-save-btn{width:100%;background:var(--green);border:none;border-radius:12px;padding:14px;color:#fff;font-family:'Outfit',sans-serif;font-size:0.95rem;font-weight:700;cursor:pointer;}
    /* round history cards */
    .round-card{background:var(--surface);border:var(--c-border);border-radius:14px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--c-shadow);}
    .round-card-top{display:flex;justify-content:space-between;align-items:flex-start;}
    .round-card-score{font-family:'Bebas Neue',sans-serif;font-size:2rem;color:var(--gold);line-height:1;}
    .round-card-meta{font-size:0.72rem;color:var(--muted);margin-top:3px;}
    .round-card-del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:1rem;padding:2px 5px;}
    .round-holes-row{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px;padding-top:8px;border-top:1px solid var(--border);}
    .round-hole-chip{font-size:0.68rem;background:var(--surface2);border-radius:6px;padding:3px 6px;color:var(--muted);}
    .round-hole-chip.good{color:var(--green);background:rgba(26,92,46,0.08);}
    /* ── BRANDING FOOTER ── */
    .sv-credit{display:flex;align-items:center;justify-content:center;gap:9px;padding:24px 20px 20px;margin-top:4px;border-top:1px solid var(--border);}
    .sv-credit img{width:28px;height:28px;border-radius:50%;flex-shrink:0;}
    .sv-credit-text{font-size:0.7rem;color:var(--muted);letter-spacing:.3px;}
    .sv-credit-text strong{color:var(--cream);font-weight:700;}
    /* swing steps */
    .sw-step{display:flex;align-items:flex-start;gap:13px;background:var(--surface);border:var(--c-border);border-radius:16px;padding:16px;margin-bottom:10px;box-shadow:var(--c-shadow);}
    .sw-num{background:rgba(26,92,46,0.1);border:none;border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:1.1rem;color:var(--green);flex-shrink:0;}
    body.dark .sw-num{background:rgba(201,168,76,0.12);color:var(--gold);}
    @media(min-width:600px){#app{max-width:500px;margin:0 auto;box-shadow:0 0 60px rgba(0,0,0,.12);}body.dark #app{box-shadow:0 0 80px rgba(0,0,0,.7);}#landing{align-items:center;}#landing>*{width:100%;max-width:480px;}.ld-cards{max-width:440px;}}
    /* ── CADDIE ── */
    .mic-wrap{display:flex;flex-direction:column;align-items:center;padding:20px 0 10px;}
    .mic-btn{width:76px;height:76px;border-radius:50%;border:none;background:var(--green);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1.9rem;box-shadow:0 4px 22px rgba(45,106,63,0.35);transition:transform .15s,box-shadow .15s;}
    .mic-btn:active{transform:scale(0.93);}
    .mic-btn.listening{background:linear-gradient(135deg,#b91c1c,#7f1d1d);animation:caddie-pulse 1.4s ease-in-out infinite;}
    @keyframes caddie-pulse{0%,100%{box-shadow:0 4px 22px rgba(185,28,28,0.4);}50%{box-shadow:0 4px 44px rgba(185,28,28,0.75),0 0 0 12px rgba(185,28,28,0.12);}}
    .mic-status{font-size:0.72rem;color:var(--muted);text-align:center;margin-top:9px;letter-spacing:.3px;}
    .caddie-bubble{background:var(--surface);border:var(--c-border);border-radius:16px;padding:16px 18px;margin:14px 0 6px;font-size:0.9rem;color:var(--cream);line-height:1.65;min-height:64px;box-shadow:var(--c-shadow);}
    .caddie-club{display:block;font-family:'Bebas Neue',sans-serif;font-size:1.4rem;color:var(--green);margin-top:8px;letter-spacing:1px;}

<script>
// ── CONFIG ──
const CADDIE_URL    = 'https://spinvibes-caddie.spinvibes.workers.dev';
const SUPABASE_URL  = 'https://zairvjyiwhajsulefyoi.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InphaXJ2anlpd2hhanN1bGVmeW9pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxMDkxODAsImV4cCI6MjA5MTY4NTE4MH0.AAdJfqSGHMergPgL4tEoBMn0Wr5d8D1NuxhPMonp_60';

const P       = new URLSearchParams(location.search);
const _userId = P.get('u'); // UUID personal link — takes priority over URL params

let a; // populated by initGuide() — do not access before that resolves
let _coachingPlan = null; // AI-generated coaching brief, loaded from Supabase

// Build profile object from URL params (legacy links / fallback)
function buildAFromParams() {
  return {
    name:      decodeURIComponent(P.get('n') || 'Golfer'),
    hand:      P.get('h') === 'l' ? 'left' : 'right',
    age:       P.get('a') || 'adult',
    experience:P.get('exp') || 'some',
    gender:    P.get('gdr') || 'm',
    skill:     P.get('s') || 'mid',
    goal:      P.get('g') || 'break90',
    location:  P.get('loc') || 'range',
    weaknesses:(P.get('w') || '').split(',').filter(Boolean),
    faults:    (function(){ const o={}; (P.get('fl')||'').split(',').filter(Boolean).forEach(p=>{const i=p.indexOf('-'); if(i>0) o[p.slice(0,i)]=p.slice(i+1);}); return o; })(),
    advanced:  (function(){ const v=(P.get('adv')||'').split('.'); return v.length>=3 && (v[0]||v[1]||v[2]) ? {flight:v[0]||'',shape:v[1]||'',wedge:v[2]||''} : null; })(),
    freq:      P.get('f') || 'weekly',
    duration:  P.get('d') || 'long',
    equip:     P.get('e') || 'full',
    bag:       decodeURIComponent(P.get('b') || ''),
    lessons:   P.get('les') || 'none',
    physical:  P.get('p') || 'none',
    members:   parseFM(P.get('fm') || ''),
    beg:       P.get('beg') || '0'
  };
}

function parseFM(s) {
  if (!s) return [];
  return s.split('|').map(seg => {
    const [name,age,hand,goal] = seg.split('~');
    return { name: decodeURIComponent(name||''), age: parseInt(age)||10, hand: hand||'right', goal: goal||'fun' };
  }).filter(m => m.name);
}

// ── APPLY THEME (synchronous — uses ?t= even on UUID links) ──
(function(){
  const t = P.get('t') || 'forest';
  document.body.classList.remove('dark');
  document.body.classList.add('theme-' + t);
  const btn = document.getElementById('darkBtn');
  if (btn) btn.style.display = 'none';
})();

// ── PARSE DISTANCES ──
const distKeys = ['driver','3w','hybrid','7i','9i','pw','sw'];
const distNames = {driver:'Driver','3w':'3-Wood',hybrid:'Hybrid / 5-Iron','7i':'7-Iron','9i':'9-Iron',pw:'Pitching Wedge',sw:'Sand Wedge'};
const distEmoji = {driver:'',  '3w':'', hybrid:'', '7i':'', '9i':'', pw:'', sw:''};
const DIST_EDIT_KEY = _userId
  ? 'dist_edits_u_' + _userId
  : 'dist_edits_' + (P.get('n') || 'golfer') + '_' + (P.get('s') || 'mid');
const distances = {};
(P.get('dist')||'').split(',').forEach((v,i) => { if (v && distKeys[i]) distances[distKeys[i]] = parseInt(v); });
// Merge in any locally-saved edits (these take priority over URL)
try {
  const edits = JSON.parse(localStorage.getItem(DIST_EDIT_KEY) || '{}');
  Object.assign(distances, edits);
} catch(e) {}

function clubFor(yards) {
  const entries = Object.entries(distances);
  if (!entries.length) return null;
  return entries.reduce((best, [club, dist]) =>
    Math.abs(dist - yards) < Math.abs(distances[best] - yards) ? club : best
  , entries[0][0]);
}
function clubLabelFor(yards) {
  const c = clubFor(yards);
  return c ? distNames[c] + (distances[c] ? ' (' + distances[c] + ' yds)' : '') : null;
}

// ── HELPERS ──
const gLabel = {fun:'Enjoy the Game',break120:'Break 120',break100:'Break 100',break90:'Break 90',break80:'Break 80',break70:'Break 70'};
const gNum   = {fun:'FUN',break120:'120',break100:'100',break90:'90',break80:'80',break70:'70'};
const wLabel = {driving:'Driving',irons:'Iron Play',shortgame:'Short Game',putting:'Putting',course:'Course Mgmt',mental:'Mental Game'};
const sLabel = {beginner:'Beginner',high:'110+','mid-high':'100–110',mid:'90–100','low-mid':'80–90',low:'Under 80'};
const hl = h => h === 'left' ? 'Lefty' : 'Righty';
const lead  = () => a.hand === 'left' ? 'right' : 'left';
const trail = () => a.hand === 'left' ? 'left' : 'right';
const wk    = () => a.weaknesses.map(w => wLabel[w]||w).join(' & ');
const balls = () => ({short:28,medium:45,long:60,full:80}[a.duration]||50);
const phases= () => ({short:2,medium:3,long:4,full:4}[a.duration]||3);

// ── FAULT-SPECIFIC TIPS (from wizard step 6b) — turns a generic focus card into
// a callout about the player's EXACT miss + the one drill that fixes it. ──
const FAULT_TIP = {
  'driving-slice':   {t:'Your miss: slice', d:'Open face / out-to-in path. Strengthen the lead-hand grip (2–3 knuckles visible) and feel the trail forearm rotate over through impact.', drill:'Headcover-outside-the-ball drill — swing without clipping it to groove an in-to-out path.'},
  'driving-hook':    {t:'Your miss: hook', d:'Face too closed or path too far in-to-out. Ease the grip to neutral and rotate your body through so your chest faces the target at finish.', drill:'Feet-together swings at 70% to re-sync arms and body.'},
  'driving-pushpull':{t:'Your miss: starts offline', d:'Ball flies fairly straight but starts left or right — your clubface points where the ball starts. Fix aim and ball position (off the lead heel).', drill:'Alignment-stick gate at setup; start every ball through the gate.'},
  'driving-low':     {t:'Your miss: low & short', d:'You\'re hitting down on the driver. Tee it higher (half the ball above the crown), ball off the lead heel, tilt slightly away at address to hit UP +2–4°.', drill:'Tee it high and clip it on a slight upswing — feel "launch."'},
  'driving-twoway':  {t:'Your miss: two-way', d:'Start line varies — this is clubface stability, not path. Prioritize a consistent grip and a quieter lead wrist through impact.', drill:'9-to-3 driver swings at 60% watching only start direction; groove ONE start line before adding speed.'},
  'driving-distance':{t:'Your focus: more distance', d:'Distance comes from center-face contact and a positive attack angle, not swinging harder. Target driver smash 1.48–1.50.', drill:'Impact tape / foot spray to find the center; widen stance, tee high, swing up.'},
  'irons-fat':       {t:'Your miss: fat', d:'Low point is behind the ball. Get pressure forward (60% lead side at impact) with the ball slightly back of center.', drill:'Towel 4 inches behind the ball — miss the towel. Divot starts past the ball.'},
  'irons-thin':      {t:'Your miss: thin', d:'You\'re rising into the ball. Keep your posture and let the trail shoulder work down through impact.', drill:'9-to-3 punch shots: ball first, then ground.'},
  'irons-distance':  {t:'Your focus: distance control', d:'Inconsistent strike = inconsistent carry. Commit to center-face and gap your irons with real numbers.', drill:'Ladder drill — 5 balls per club, note the carry spread, shrink it.'},
  'irons-direction': {t:'Your miss: push/pull', d:'Clubface at impact controls start line — check grip and aim first.', drill:'Two-stick gate just outside the ball; start the ball through it.'},
  'irons-contact':   {t:'Your focus: control & spin', d:'Strike is solid — now clean the grooves, stay ball-first, and steepen slightly into wedges.', drill:'Trajectory windows — same club low/mid/high on command.'},
  'shortgame-chunkblade':{t:'Your miss: chunk-or-blade', d:'Low point wanders. Weight 70% on the lead foot, handle ahead, rock the shoulders — no wrist flip.', drill:'Hinge-and-hold; land each chip on a towel.'},
  'shortgame-distance':  {t:'Your focus: pitch distance', d:'20–60 yds needs a repeatable system, not feel.', drill:'Clock drill — 7/9/11 o\'clock backswings; log the carry for each wedge.'},
  'shortgame-bunker':    {t:'Your focus: bunkers', d:'Open the face, enter the sand ~2 inches behind the ball, accelerate through, finish.', drill:'Draw a line in the sand and splash the line (no ball) until consistent.'},
  'shortgame-spin':      {t:'Your focus: spin & check', d:'Spin needs clean grooves, ball-first contact, a steeper angle, and a firmer lie.', drill:'Hit identical pitches and read the second bounce.'},
  'putting-threeputt':   {t:'Your leak: 3-putts', d:'Distance control outside 20 ft is the separator.', drill:'Ladder 30/40/50 ft, stop each inside a 3-ft circle; Eyes-Closed putts to feel pace.'},
  'putting-short':       {t:'Your leak: short putts', d:'Steady head, square face, accelerate through.', drill:'Gate drill (two tees just wider than the putter) from 4–6 ft; make 25 in a row.'},
  'putting-read':        {t:'Your leak: green reading', d:'Read from the low side, find the fall line, play more break than you think.', drill:'Tee a ball at the apex of your read and roll putts over it.'},
  'putting-startline':   {t:'Your leak: start line', d:'Face control plus a consistent path.', drill:'Gate drill + a chalk line to verify you start the ball on your intended line.'},
  'course-club':         {t:'Your focus: club selection', d:'Club to the CENTER of the green and to your carry number — not your best-ever number.', drill:'Pick the club that covers the front and leaves an uphill putt. Track GIR.'},
  'course-risk':         {t:'Your focus: smarter risk', d:'Before every shot ask "where does the miss hurt most?" and aim away from it.', drill:'Play your stock shot; lay up to a full wedge number instead of forcing it.'},
  'course-trouble':      {t:'Your focus: escaping trouble', d:'First shot out of trouble goes to safety, not the green.', drill:'Punch out to your favorite wedge yardage. One bad shot, not two.'},
  'course-tempo':        {t:'Your focus: pre-shot plan', d:'Build a repeatable routine: decision → visualize → commit → swing.', drill:'Never stand over a shot you haven\'t committed to.'},
  'mental-firsttee':     {t:'Your focus: first-tee nerves', d:'Longer warm-up + a conservative first-tee target (fairway finder, not driver).', drill:'Box-breathing before the shot; pick a tiny target.'},
  'mental-bounceback':   {t:'Your focus: bounce-back', d:'The 10-second rule — react, then it\'s gone by the time you reach the bag.', drill:'Have a reset word. One bad hole never costs two.'},
  'mental-focus':        {t:'Your focus: focus over 18', d:'Switch "on" only inside your routine, "off" between shots.', drill:'You concentrate for 14 swings, not 4 hours — practice switching off.'},
  'mental-confidence':   {t:'Your focus: confidence', d:'Doubt comes from indecision — commit to one shot and one target.', drill:'Track "committed swings" as a stat, not just score.'},
};
function faultTip(w) {
  const f = (a.faults || {})[w];
  if (!f) return '';
  const tip = FAULT_TIP[`${w}-${f}`];
  if (!tip) return '';
  return `<div style="background:rgba(34,150,87,0.10);border:1px solid rgba(34,150,87,0.30);border-radius:10px;padding:11px 13px;margin-top:10px;font-size:0.8rem;color:var(--cream);line-height:1.5;">
    <strong style="color:var(--green);"><i class="ti ti-target" style="vertical-align:-1px;"></i> ${tip.t}.</strong> ${tip.d}<br>
    <strong>Drill:</strong> ${tip.drill}</div>`;
}

// ── COACH BRIEF ──
function buildCoachBrief() {
  // If we have an AI-generated plan from Supabase, use it directly
  if (_coachingPlan) {
    return `<div class="coach-brief">
      <div class="cb-head"><i class="ti ti-message-circle" style="vertical-align:-1px;font-size:0.9rem;"></i> Coach's Brief</div>
      <div style="font-size:0.87rem;color:var(--cream);line-height:1.72;">${_coachingPlan.replace(/\n\n/g,'<br><br>').replace(/\n/g,' ')}</div>
    </div>`;
  }

  // Fallback: hardcoded content for legacy/param-only links
  const w1 = a.weaknesses[0];
  const w2 = a.weaknesses[1];
  const goal = a.goal;

  const diagMap = {
    driving:   'Off the tee is where rounds unravel — wayward drives force recovery shots that chain into doubles.',
    irons:     'Iron inconsistency is the quiet score-killer. Solid contact from 100–160 yards separates your current level from the next one.',

// Encode family members the same way the wizard does, so they always reach the
// app even if the guide_users.members column wasn't persisted (belt-and-suspenders).
function _fmParam() {
  const mem = Array.isArray(a.members) ? a.members : [];
  if (!mem.length) return '';
  return mem.map(m => `${encodeURIComponent(m.name)}~${m.age}~${String(m.hand||'right')[0]}~${m.goal||'fun'}`).join('|');
}
function _appUrl() {
  const fm = _fmParam();
  if (_userId) return 'https://app.spinvibes.com?u=' + _userId + (fm ? '&fm=' + encodeURIComponent(fm) : '');
  // fallback: pass key params
  const p = new URLSearchParams({ u: 'preview', n: a.name, h: a.hand[0], s: a.skill, g: a.goal, a: a.age });
  if (fm) p.set('fm', fm);
  return 'https://app.spinvibes.com?' + p.toString();
}

  const url = _appUrl();

}

function renderYardageChart() {
  const filled = distKeys.filter(k => distances[k]);
  const isGeneric = filled.length === 0;
  const distTable = a.gender === 'f' ? genericDistsF : genericDistsM;
  const gen = distTable[a.skill] || distTable.mid;
  const label = isGeneric ? `Estimated Yardages — ${sLabel[a.skill]||'Your Level'}` : 'My Yardage Chart';
  const genderLabel = a.gender === 'f' ? 'women' : 'men';
  const note  = isGeneric ? `<div style="font-size:0.7rem;color:var(--muted);padding-top:8px;"><i class="ti ti-map-pin" style="vertical-align:-1px;"></i> Typical ranges for ${genderLabel} at your skill level. <span style="color:var(--gold);cursor:pointer;" onclick="openDistSheet()">Tap Edit to add yours.</span></div>` : '';
  const rows = distKeys.map(k => {
    const val  = distances[k] ? `${distances[k]} <span style="font-size:0.62rem;color:var(--muted);font-family:'Outfit',sans-serif;font-weight:400;">yds</span>` : `<span style="font-size:0.82rem;color:var(--muted);">${gen[k]} yds</span>`;

  // Smart callouts — only show if actual distances entered
  const callouts = !isGeneric ? [200,175,150,125,100].map(y => {
    const c = clubFor(y); if (!c) return null;
    if (Math.abs(distances[c] - y) > 20) return null;
    return `<span style="margin-right:8px;"><i class="ti ti-map-pin" style="vertical-align:-1px;font-size:0.8rem;"></i> ${y}y → ${distNames[c]}</span>`;
  }).filter(Boolean) : [];
  return `

    break120: '<i class="ti ti-leaf"></i> <strong>Make contact and keep moving</strong> — don\'t stop mid-round to fix your swing',
    break100: '<i class="ti ti-ban"></i> <strong>One mistake at a time</strong> — bogeys are fine, doubles kill your score',
    break90:  '<i class="ti ti-target"></i> <strong>Commit before you swing</strong> — indecision is the most common double bogey',
    break80:  '<i class="ti ti-trophy"></i> <strong>Trust your routine</strong> — you have the swing. Trust it.',
    break70:  '<i class="ti ti-trophy"></i> <strong>Stay neutral</strong> — no shot is "big." Same routine on the 1st tee and the 72nd hole.'
  };
  const thoughts = bySkill[a.skill] || bySkill.mid;

  return `<div class="card">

}

function renderRange() {
  if (a.beg === '1') return renderBeginnerPractice();
  const b = balls(), ph = phases();
  const b0=5, b1=Math.round((b-b0)*0.40), b2=Math.round((b-b0)*0.35), b3=b-b0-b1-b2;
  const hasDrv = a.weaknesses.includes('driving');
  const hasIrn = a.weaknesses.includes('irons');
  const hasSG  = a.weaknesses.includes('shortgame');
  const focus  = wk();

  const phaseCard = (n,color,title,clubs,balls,body,cue,highlight) =>
    `<div class="card" ${highlight?'style="border-color:rgba(138,96,16,0.5);"':''}>
      <span class="tag ${color}">${highlight?'⭐ ':''}Phase ${n}</span>
      <div class="ct">${title}</div>
      <div class="pills-row">${clubs.map(c=>`<span class="ptag">${c}</span>`).join('')}<span class="ptag">${balls} balls</span></div>
      <div class="cb">${body}</div>
      <div class="cue">${cue}</div>
    </div>`;

  let html = `<div class="stat-row">
    <div class="stat"><div class="sn">${b}</div><div class="sl">Balls</div></div>
    <div class="stat"><div class="sn">${ph}</div><div class="sl">Phases</div></div>
    <div class="stat"><div class="sn">${{short:'15–30',medium:'30–45',long:'45–60',full:'60–90'}[a.duration]||'45–60'}</div><div class="sl">Minutes</div></div>
    <div class="stat"><div class="sn">${gNum[a.goal]||'–'}</div><div class="sl">Goal</div></div>
  </div>`;

  // Warmup
  html += `<div class="card"><span class="tag tg-pur">Phase 0</span><div class="ct">Warmup — No ball yet</div>
    <div class="pills-row"><span class="ptag">PW</span><span class="ptag">3 min</span><span class="ptag">Always first</span></div>
    <div class="cb">
      <strong>Pump Swings</strong> · 10 reps, no ball — feel the club like a pendulum<br><br>
      <strong>Feet Together</strong> · 5 shots — forces balance. Fall over? You swung too hard.<br><br>
      <strong>Half Swings</strong> · 5 shots — club to 9 o'clock back, 3 o'clock through. Clean contact before full speed.
    </div>
    <div class="cue">Warmup is non-negotiable — cold muscles build bad habits</div></div>`;

  // Phase 1
  html += phaseCard(1,'tg-gld','Short Irons — Contact Quality',['9-iron','PW','GW'],b1,
    (hasIrn?'<strong>⭐ YOUR FOCUS AREA</strong> — short irons win and lose more strokes than any other club. Every ball here counts.<br><br>':'')
    +`<strong>Ball center.</strong> Weight 50/50 at address, shifts fully to your ${lead()} side by impact. Focus: divot starts past the ball, not behind it. Consistent finish every time.`
    +faultTip('irons'),
    'Ball first, then ground — the divot tells you everything', hasIrn);

  if (ph >= 3) html += phaseCard(2,'tg-org','Mid Irons + Hybrid',['7-iron','6-iron','Hybrid'],b2,
    `<strong>Ball position:</strong> 1–2 ball-widths toward your ${lead()} foot as clubs get longer.<br>Same sequence as short irons — hips first, then hands. Wider arc, not harder swing.`,
    'Wider arc, same sequence — let the shaft do the work', false);

  if (ph >= 4 || hasDrv) html += phaseCard(3,'tg-blu','Driver',[`Driver`],Math.round(b3*0.6),
    (hasDrv?'<strong>⭐ YOUR FOCUS AREA</strong> — pick a target and commit. Swing at 80% — control beats distance every time.<br><br>':'')
    +`<strong>Ball position:</strong> off ${lead()} instep. Tee high, slight upswing at impact. Swing smoother, not harder.`
    +faultTip('driving'),
    'Sweep up through the ball — tempo over power', hasDrv);

  if (ph >= 4) html += phaseCard(4,'tg-grn','Game Simulation',['Any club'],Math.round(b3*0.4),
    (hasSG?'<strong>⭐ YOUR FOCUS AREA</strong> — pick targets, play real shots. Land it on a spot and let it release.<br><br>':'')
    +'Pick a different target every shot. Simulate real course decisions. Play the miss, not just the perfect shot.'
    +faultTip('shortgame'),
    'Pick a target, commit, execute — no practice swings', hasSG);

  return html;
}

// ── BACKYARD / HOME PLAN ──
function renderBackyardPlan() {
  const isShort  = a.duration === 'short';
  const isMedium = a.duration === 'medium';
  const minutes  = {short:'15–20', medium:'25–35', long:'40–50', full:'50–60'}[a.duration] || '30–45';
  const hasPutt  = a.weaknesses.includes('putting');
  const hasChip  = a.weaknesses.includes('shortgame');
  const isBack   = a.physical === 'back';

  const drill = (e,title,sub,body,cue,highlight) =>
    `<div class="card" ${highlight?'style="border-color:rgba(138,96,16,0.5);"':''}>
      ${highlight?'<span class="tag tg-gld">⭐ Focus Area</span>':''}
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
        <div style="font-size:1.6rem;">${e}</div>
        <div><div class="ct">${title}</div><div style="font-size:0.72rem;color:var(--muted);">${sub}</div></div>
      </div>
      <div class="cb">${body}</div>
      ${cue?`<div class="cue">${cue}</div>`:''}
    </div>`;

  let html = `<div class="stat-row">
    <div class="stat"><div class="sn">${minutes}</div><div class="sl">Minutes</div></div>
    <div class="stat"><div class="sn">0</div><div class="sl">Balls Needed</div></div>
    <div class="stat"><div class="sn">HOME</div><div class="sl">No Range</div></div>
    <div class="stat"><div class="sn">${gNum[a.goal]||'–'}</div><div class="sl">Goal</div></div>
  </div>
  <div class="card" style="background:rgba(45,106,63,0.08);border-color:rgba(45,106,63,0.3);">
    <div class="cb" style="font-size:0.78rem;"><i class="ti ti-home" style="color:var(--green);vertical-align:-1px;"></i> <strong>No range needed.</strong> These drills build the same skills as a range session — just at a smaller scale. Grip, tempo, and putting are best practiced at home anyway.</div>
  </div>`;

  // Grip & Setup
  html += drill('<i class="ti ti-hand-grab" style="font-size:1.4rem;color:var(--gold);"></i>','Grip & Setup Rehearsal','5 min · no ball required',
    `Pick up your club 10 times and regrip from scratch each time. Check: <br>
    <strong>1.</strong> Clubface square before your hands go on<br>
    <strong>2.</strong> Light pressure — toothpaste test<br>
    <strong>3.</strong> Ball position (use a tee on the floor if inside)<br>
    Then take 20 slow practice swings focusing only on your takeaway — one-piece, hands-arms-chest together.`,
    'Grip is the only contact with the club — get it right first', false);

  // Mirror work
  html += drill('<i class="ti ti-eye" style="font-size:1.4rem;color:var(--gold);"></i>','Mirror Work — Swing Check','5 min · use any mirror or window',
    `Stand side-on to a mirror (hallway mirror, bathroom, glass door). Take slow practice swings and check:<br>
    <strong>Takeaway:</strong> club should track outside the hands, not roll inside<br>
    <strong>Top:</strong> ${a.physical==='shoulder'?'Keep it to 3/4 — don\'t force a full turn if the shoulder protests':'club roughly parallel to ground, left arm relatively straight'}<br>
    <strong>Finish:</strong> belt buckle facing target, ${trail()} foot on toe`,
    'What you see in the mirror is what the ball sees', false);

  // Putting mat or carpet
  html += drill('<i class="ti ti-circle" style="font-size:1.4rem;color:var(--gold);"></i>',hasPutt?'Putting — YOUR FOCUS AREA':'Putting Practice',
    hasPutt?'10 min · high priority':'8 min · mat or smooth carpet',
    `${hasPutt?'<strong>⭐ This is where you drop the most strokes. 10 minutes here is worth 20 at the range.</strong><br><br>':''}
    <strong>3-foot circle drill:</strong> Place 4–6 balls in a circle around a target (a coin, a cup, any mark). Make every one before you move out. Start at 3 feet.<br><br>
    <strong>Gate drill:</strong> Put two tees 1 ball-width apart, 6 inches in front of the ball. Roll it through the gate — teaches a square putter face.<br><br>
    <strong>Lag drill:</strong> If you have space, practice 10-footers to just stop the ball at a target. Distance control wins more putts than line.`
    +faultTip('putting'),
    'Make 10 from 3 feet before you touch a longer putt', hasPutt);

  // Chipping net or chip without net
  if (!isShort) {
    html += drill('<i class="ti ti-target" style="font-size:1.4rem;color:var(--gold);"></i>',hasChip?'Chipping — YOUR FOCUS AREA':'Chipping Practice',
      hasChip?'8 min · chipping net or a towel target':'5 min · chip into a target',
      `${hasChip?'<strong>⭐ Short game is the fastest way to lower your score. Every chip counts.</strong><br><br>':''}
      <strong>No net?</strong> Set a folded towel on the grass or carpet. Try to land the ball on it using a PW or 9-iron.<br><br>
      <strong>Hinge-and-hold drill:</strong> Hinge the wrist on the backswing, then hold the angle through impact — no flipping. Your hands should finish slightly ahead of the clubhead.<br><br>
      <strong>Key thought:</strong> Small backswing, accelerate through. Chip from a narrow stance, weight forward (60% on ${lead()} foot).`
      +faultTip('shortgame'),
      'Hands ahead at impact — every time', hasChip);
  }

  // Alignment & Balance
  if (!isShort) {
    html += drill('<i class="ti ti-scale" style="font-size:1.4rem;color:var(--gold);"></i>','Balance & Tempo Drill','5 min · slow swings only',
      `${isBack?'<i class="ti ti-alert-triangle" style="color:#f59e0b;vertical-align:-1px;"></i> Keep these at 50% effort max — no torque on the lower back.<br><br>':''}
      Take 20 full practice swings with your <strong>feet together</strong> (touching). This forces you to swing in balance. If you fall over, you're using too much body and not enough arms.<br><br>
      Then take 10 more with a towel under your ${trail()} armpit. Keep it from falling — this keeps your arms connected to your body through the swing.`,
      'Balance is the foundation — tempo follows', false);
  }

  return html;
}

// ── SIMULATOR PLAN ──
function renderSimPlan() {
  const b = balls(), ph = phases();
  const minutes = {short:'30–40', medium:'45–60', long:'60–75', full:'75–90'}[a.duration] || '60–75';
  const hasDrv  = a.weaknesses.includes('driving');
  const hasIrn  = a.weaknesses.includes('irons');
  const hasSG   = a.weaknesses.includes('shortgame');

  const phaseCard = (n,color,title,clubs,desc,dataFocus,cue,highlight) =>
    `<div class="card" ${highlight?'style="border-color:rgba(138,96,16,0.5);"':''}>
      <span class="tag ${color}">${highlight?'⭐ ':''}Phase ${n}</span>
      <div class="ct">${title}</div>
      <div class="pills-row">${clubs.map(c=>`<span class="ptag">${c}</span>`).join('')}</div>
      <div class="cb">${desc}</div>
      ${dataFocus?`<div style="background:rgba(59,130,246,0.08);border:1px solid rgba(59,130,246,0.2);border-radius:10px;padding:10px 13px;margin-top:9px;font-size:0.78rem;color:#60a5fa;"><i class="ti ti-chart-bar" style="vertical-align:-1px;"></i> <strong>Data to watch:</strong> ${dataFocus}</div>`:''}
      <div class="cue">${cue}</div>
    </div>`;

  let html = `<div class="stat-row">
    <div class="stat"><div class="sn">${b}</div><div class="sl">Balls</div></div>
    <div class="stat"><div class="sn">${ph}</div><div class="sl">Phases</div></div>
    <div class="stat"><div class="sn">${minutes}</div><div class="sl">Minutes</div></div>
    <div class="stat"><div class="sn">SIM</div><div class="sl">Data</div></div>
  </div>
  <div class="card" style="background:rgba(59,130,246,0.06);border-color:rgba(59,130,246,0.25);">
    <div class="ct" style="color:#60a5fa;">Using the Sim Data</div>
    <div class="cb">Your simulator gives you real-time data. Focus on <strong>one number per phase</strong> — not all of them at once. The three numbers that matter most: <strong>face angle at impact</strong> (aim), <strong>attack angle</strong> (path), and <strong>smash factor</strong> (contact efficiency).</div>
  </div>`;

  // Warmup
  html += `<div class="card"><span class="tag tg-pur">Phase 0</span><div class="ct">Warmup Shots — Get Your Baseline</div>
    <div class="pills-row"><span class="ptag">PW or 9-iron</span><span class="ptag">10 balls</span><span class="ptag">50–60% effort</span></div>
    <div class="cb">Hit 10 balls at partial effort. Don't look at anything yet. Let your body find its rhythm. On balls 6–10, start glancing at <strong>carry distance</strong> — this is your baseline for today.</div>
    <div class="cue">Don't chase numbers on warmup shots — just warm up</div></div>`;

  // Phase 1: Face Angle Work
  html += phaseCard(1,'tg-gld','Face Angle — The #1 Cause of Miss',
    ['7-iron','9-iron'],
    `Hit ${Math.round(b*0.3)} balls focused only on face angle at impact. A closed face = pull/hook, open face = push/slice.<br><br>
    <strong>Drill:</strong> Hit 5 shots aiming to start the ball dead straight (not curve it). Note face angle on the sim display.<br>
    <strong>Target:</strong> Get face angle within ±2° of square consistently.`,
    'Face Angle at Impact — aim for ±2° of 0',
    'Square face + any path = decent shot. Open face + anything = right field.', hasIrn);

  if (ph >= 3) html += phaseCard(2,'tg-org','Attack Angle — Sweep vs. Dig',
    [hasDrv?'Driver':'Hybrid', '5-iron or 7-iron'],
    `${hasDrv?'<strong>⭐ Driver tip:</strong> You want a +2° to +4° attack angle (hitting up on the ball) for max carry and lower spin.<br><br>':''}
    For irons, you want a slight negative attack angle (–2° to –4°) — ball first, then turf.<br><br>
    <strong>Drill:</strong> Hit 10 driver shots. Check if your attack angle is positive. If negative, tee the ball higher and feel like you're sweeping up through it.`,
    hasDrv ? 'Attack Angle (Driver) — aim for +2° to +4°' : 'Attack Angle (Irons) — aim for –2° to –4°',
    hasDrv ? 'Sweep the driver up — ball launches higher, spins less, carries further' : 'Ball first, turf second — divot starts past where the ball was', hasDrv);

  if (ph >= 4) html += phaseCard(3,'tg-blu','Smash Factor — Clean Contact',
    ['Driver', '7-iron'],
    `Smash factor = ball speed ÷ club speed. Target: <strong>Driver 1.48–1.50, Irons 1.38–1.42</strong>.<br><br>
    If your smash is below target, you're losing energy at impact (toe/heel hits). Hit 10 balls trying to feel the center of the face every time.<br><br>
    <strong>Impact tape drill:</strong> If available, put a piece of tape on the face after warmup — your impact pattern tells you everything.`,
    'Smash Factor — Driver: 1.48+, Irons: 1.38+',
    'Smash factor doesn\'t lie — low number = off-center contact', false);

  html += phaseCard(ph >= 4 ? 4 : 3, 'tg-grn',hasSG?'Short Game Sim — YOUR FOCUS AREA':'Course Simulation',
    ['Any club'],
    `${hasSG?'<strong>⭐ Play a sim round focused on short game strategy — take the smarter shot every time, not the hero shot.</strong><br><br>':''}
    Play 3–5 holes on the sim as a real round. Each shot: pick a specific target, not just "the fairway." Use your real pre-shot routine. Treat every shot like it counts.<br><br>
    <strong>Strategy rule:</strong> Never aim at a pin guarded by trouble. Use the whole green. Miss in the easy spot.`,
    null,
    'Pick a target, commit, swing — sim rounds are real practice', hasSG);

  return html;
}

    {n:4,title:'Top of Backswing',body:`${trail().charAt(0).toUpperCase() + trail().slice(1)} shoulder under your chin. Club parallel to the ground or slightly short — more backswing doesn't mean more distance. Feel the coil in your core.`,cue:'Coil, don\'t collapse'},

function getEffectiveDistances() {
  const distTable = a.gender === 'f' ? genericDistsF : genericDistsM;
  const gen = distTable[a.skill] || distTable.mid;
  const result = {};
  distKeys.forEach(k => {
    if (distances[k]) {
      result[k] = distances[k];
    } else {
      const range = gen[k] || '150–160';
      const parts = range.split('–').map(Number);
      result[k] = parts.length === 2 ? Math.round((parts[0] + parts[1]) / 2) : 150;
    }
  });
  return result;
}

function buildCaddieSystemPrompt() {
  const d = getEffectiveDistances();
  const isGeneric = Object.keys(distances).filter(k => distances[k]).length === 0;
  const distNote = isGeneric ? ' (typical for skill level)' : '';
  const physNote = a.physical && a.physical !== 'none' ? ` Physical constraint: ${a.physical}.` : '';
  return `You are a golf caddie for ${a.name}. Reply in ONE sentence only, max 20 words. Always end with the club in [brackets] if a club recommendation is relevant.
Distances${distNote}: Driver ${d.driver}y · 3W ${d['3w']}y · Hybrid ${d.hybrid}y · 7i ${d['7i']}y · 9i ${d['9i']}y · PW ${d.pw}y · SW ${d.sw}y
Skill: ${sLabel[a.skill]||a.skill}. Goal: ${gLabel[a.goal]||a.goal}.${physNote}
Rules: Account for wind/elevation/lie if mentioned. Recommend one club only. No filler words. No yardage math shown.`;
}

let caddieRecognition = null;
let caddieListening   = false;
let lastCaddieCall    = 0;

const CADDIE_COOLDOWN = 7000; // ms between API calls

function setCaddieControlsDisabled(disabled) {
  const micBtn = document.getElementById('micBtn');
  const exampleBtns = document.querySelectorAll('.example-q');
  if (micBtn) micBtn.disabled = disabled;
  exampleBtns.forEach(b => { b.disabled = disabled; b.style.opacity = disabled ? '0.4' : ''; });
}

function startCaddieCountdown() {
  const status = document.getElementById('caddieStatus');
  setCaddieControlsDisabled(true);
  let remaining = Math.ceil(CADDIE_COOLDOWN / 1000);
  if (status) status.textContent = `Next question in ${remaining}s…`;
  caddieCountdownTimer = setInterval(() => {
    remaining--;
    if (remaining <= 0) {
      clearInterval(caddieCountdownTimer);
      caddieCountdownTimer = null;
      setCaddieControlsDisabled(false);
      if (status) status.textContent = 'Tap to ask your caddie';
    } else {
      if (status) status.textContent = `Next question in ${remaining}s…`;
    }
  }, 1000);
}

async function askCaddie(text) {
  const bubble = document.getElementById('caddieBubble');
  const status = document.getElementById('caddieStatus');
  if (!bubble) return;

  // Rate limit check
  const now = Date.now();
  const elapsed = now - lastCaddieCall;
  if (lastCaddieCall > 0 && elapsed < CADDIE_COOLDOWN) {
    const wait = Math.ceil((CADDIE_COOLDOWN - elapsed) / 1000);
    if (status) status.textContent = `Next question in ${wait}s…`;
    return;
  }

  lastCaddieCall = now;
  startCaddieCountdown();

  bubble.innerHTML = '<span style="color:var(--muted);"><i class="ti ti-loader-2" style="vertical-align:-1px;"></i> Thinking…</span>';
  if (status) status.textContent = 'Consulting your caddie…';

  try {
    const res = await fetch(CADDIE_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: [{ role: 'user', content: text }], systemPrompt: buildCaddieSystemPrompt(), max_tokens: 60 }),
    });

    if (!res.ok) {
      const errText = await res.text();
      throw new Error(errText || 'Server error');
    }

    const data = await res.json();
    const reply = data.reply || "Let me think about that one.";

    // Highlight club recommendation [in brackets]
    const display = reply.replace(/\[([^\]]+)\]/g, '<span class="caddie-club"><i class="ti ti-flag-2" style="font-size:1rem;vertical-align:-1px;"></i> $1</span>');
    bubble.innerHTML = `<div>${display}</div>`;

    // Speak the reply (strip brackets for TTS)
    speakCaddieReply(reply.replace(/\[([^\]]+)\]/g, '$1'));

  } catch (err) {
    console.error('Caddie error:', err);
    const msg = err.message.includes('Caddie not configured')
      ? 'Caddie is being set up — check back soon.'
      : 'Can\'t reach caddie right now. Check your connection.';
    bubble.innerHTML = `<span style="color:#f87171;font-size:0.85rem;">${msg}</span>`;
  }
}

function speakCaddieReply(text) {
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.rate  = 1.05;
  utter.pitch = 1.0;
  // Prefer a clear male voice if available
  const loadVoice = () => {
    const voices = speechSynthesis.getVoices();
    const pref = voices.find(v =>
      v.name === 'Daniel' || v.name === 'Alex' ||
      (v.lang.startsWith('en') && v.name.includes('Male'))
    ) || voices.find(v => v.lang.startsWith('en-US'));
    if (pref) utter.voice = pref;
    speechSynthesis.speak(utter);
  };
  if (speechSynthesis.getVoices().length) {
    loadVoice();
  } else {
    speechSynthesis.onvoiceschanged = loadVoice;
  }
}

function toggleListening() {
  caddieListening ? stopListening() : startListening();
}

function startListening() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    const s = document.getElementById('caddieStatus');
    if (s) s.textContent = 'Voice not supported — use the examples below';
    return;
  }

  caddieRecognition = new SR();
  caddieRecognition.continuous     = false;
  caddieRecognition.interimResults = true;
  caddieRecognition.lang           = 'en-US';

  caddieRecognition.onstart = () => {
    caddieListening = true;
    const btn = document.getElementById('micBtn');
    const status = document.getElementById('caddieStatus');
    if (btn) { btn.classList.add('listening'); btn.innerHTML = '<i class="ti ti-player-stop-filled" style="font-size:1.9rem;color:#fff;"></i>'; }
    if (status) status.textContent = 'Listening…';
    const bubble = document.getElementById('caddieBubble');
    if (bubble) bubble.innerHTML = '<span style="color:var(--muted);font-style:italic;">Say your shot details…</span>';
  };

  caddieRecognition.onresult = (event) => {
    const transcript = Array.from(event.results).map(r => r[0].transcript).join('');
    const bubble = document.getElementById('caddieBubble');
    if (bubble) bubble.innerHTML = `<span style="color:var(--muted);font-style:italic;">"${transcript}"</span>`;
    if (event.results[event.results.length - 1].isFinal) {
      stopListening();
      askCaddie(transcript);
    }
  };

  caddieRecognition.onerror = (e) => {
    stopListening();
    const s = document.getElementById('caddieStatus');
    if (s) s.textContent = e.error === 'not-allowed'
      ? 'Mic blocked — tap the lock icon in your browser to allow it'
      : 'Didn\'t catch that — tap to try again';
  };

  caddieRecognition.onend = () => stopListening();
  caddieRecognition.start();
}

function stopListening() {
  caddieListening = false;
  if (caddieRecognition) {
    try { caddieRecognition.stop(); } catch (_) {}
    caddieRecognition = null;
  }
  const btn = document.getElementById('micBtn');
  const status = document.getElementById('caddieStatus');
  if (btn) { btn.classList.remove('listening'); btn.innerHTML = '<i class="ti ti-microphone" style="font-size:1.9rem;color:#fff;"></i>'; }
  if (status && status.textContent === 'Listening…') {
    status.textContent = 'Tap to ask your caddie';
  }
}

  if (_userId) {

        headers: {

function buildHoleGrid(n) {
  const grid = document.getElementById('holeGrid');
  grid.innerHTML = Array.from({length: n}, (_,i) => `
    <div class="hole-cell">
      <div class="hole-num">${i+1}</div>
      <input class="hole-score-input" type="number" min="1" max="20" id="hs${i+1}"
        oninput="updateRoundTotal()" placeholder="–">
    </div>`).join('');

function updateRoundTotal() {
  let total = 0;
  let any = false;
  for (let i = 1; i <= _roundHoles; i++) {
    const v = parseInt(document.getElementById('hs'+i)?.value || '');
    if (!isNaN(v)) { total += v; any = true; }
  }
  document.getElementById('roundTotal').textContent = any ? total : '—';
}
async function saveRound() {
  const holes = [];
  let total = 0;
  for (let i = 1; i <= _roundHoles; i++) {
    const v = parseInt(document.getElementById('hs'+i)?.value || '');
    holes.push({ hole: i, score: isNaN(v) ? null : v });
    if (!isNaN(v)) total += v;
  }
  const course = document.getElementById('roundCourse').value.trim() || null;
  const notes  = document.getElementById('roundNotes').value.trim() || null;
  const payload = {
    user_id:    _userId || null,
    course_name: course,
    date_played: new Date().toISOString().split('T')[0],
    total_score: total || null,
    holes:       holes,
    notes:       notes,
  };
  try {
    await fetch(`${SUPABASE_URL}/rest/v1/guide_rounds`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        apikey: SUPABASE_ANON,
        Authorization: `Bearer ${SUPABASE_ANON}`,
      },
      body: JSON.stringify(payload),
    });
  } catch(e) { console.warn('saveRound error:', e); }
  closeRoundSheet();

          age:        u.age || 'adult',
          experience: u.experience || 'some',
          gender:     u.gender || 'm',
          skill:      u.skill || 'mid',
          goal:       u.goal || 'break90',
          location:   u.location || 'range',
          weaknesses: Array.isArray(u.weaknesses) ? u.weaknesses : [],
          faults:     (u.personalization && u.personalization.faults) || {},
          advanced:   (u.personalization && u.personalization.advanced) || null,
          freq:       u.freq || 'weekly',
          duration:   u.duration || 'long',
          equip:      u.equip || 'full',
          bag:        u.bag || '',
          lessons:    u.lessons || 'none',
          physical:   u.physical || 'none',
          members:    Array.isArray(u.members) ? u.members : [],
          beg:        u.beg ? '1' : '0',
        };
        if (u.distances && typeof u.distances === 'object') {
          Object.assign(distances, u.distances);
        }
        // Load AI-generated coaching plan if it exists
        _coachingPlan = u.coaching_plan || null;
      }
    } catch(e) {
      console.warn('Failed to load profile from Supabase:', e);
    }
  }
  // Fallback to URL params (legacy links or Supabase failed)
  if (!a) a = buildAFromParams();
  buildLanding();
}
initGuide();
</script>
